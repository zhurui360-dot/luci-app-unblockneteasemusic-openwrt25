name: Build luci-app-unblockneteasemusic

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.4-1-openwrt25.12)'
        required: false
        default: ''
      publish:
        description: 'Publish a GitHub Release'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (OpenWrt ${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # kernel 6.12 -> OpenWrt 25.12 系列，包管理器为 apk
          # 插件是 noarch(all)，x86/64 SDK 编出的包可用于任意 CPU 架构
          - version: 25.12.4
            target: x86/64

    env:
      OWRT_VERSION: ${{ matrix.version }}
      OWRT_TARGET: ${{ matrix.target }}
      PKG_NAME: luci-app-unblockneteasemusic
      UPSTREAM_REPO: https://github.com/UnblockNeteaseMusic/luci-app-unblockneteasemusic.git
      # 25.12 的 LuCI 是 JS 版，必须使用 js 分支；master 分支是老的 Lua 版，不兼容
      UPSTREAM_BRANCH: js

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file gawk gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip wget zlib1g-dev zstd

      - name: Fetch package source (${{ env.UPSTREAM_BRANCH }} branch)
        run: |
          set -e
          git clone --depth 1 -b "$UPSTREAM_BRANCH" "$UPSTREAM_REPO" "package/$PKG_NAME"
          rm -rf "package/$PKG_NAME/.git"

      - name: Download OpenWrt SDK ${{ matrix.version }}
        run: |
          set -e
          base="https://downloads.openwrt.org/releases/$OWRT_VERSION/targets/$OWRT_TARGET"
          sdk=$(wget -qO- "$base/" | grep -oE "openwrt-sdk-[^\"']*\.tar\.zst" | head -1)
          if [ -z "$sdk" ]; then echo "SDK not found under $base"; exit 1; fi
          echo "SDK: $sdk"
          wget -q "$base/$sdk"
          mkdir -p sdk
          tar --zstd -xf "$sdk" -C sdk --strip-components=1

      - name: Install stable signing key
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          set -e
          if [ -n "$APK_SIGNING_KEY" ]; then
            # 固定密钥：保证每次编译出来的包用同一把公钥校验，
            # 用户 /etc/apk/keys/ 里导一次就永久有效
            printf '%s\n' "$APK_SIGNING_KEY" > sdk/private-key.pem
            chmod 600 sdk/private-key.pem
            echo "使用仓库 Secrets 里的固定签名密钥"
          else
            echo "未配置 APK_SIGNING_KEY，将使用 SDK 临时密钥"
          fi

      - name: Compile package
        run: |
          set -e
          cd sdk
          echo "src-link custom $GITHUB_WORKSPACE/package" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          make "package/$PKG_NAME/compile" -j"$(nproc)" V=s

      - name: Collect artifacts
        run: |
          set -e
          mkdir -p out
          find . \( -name "$PKG_NAME*.apk" -o -name "$PKG_NAME*.ipk" \) -exec cp {} out/ \;
          # SDK 自签名的公钥，放到 /etc/apk/keys/ 即可免去 --allow-untrusted
          # 注意：只发公钥，私钥 private-key.pem 绝不外传
          for f in sdk/public-key.pem sdk/key-build.pub sdk/key-build.rsa.pub; do
            if [ -f "$f" ]; then cp "$f" out/; fi
          done
          if [ -f out/public-key.pem ]; then cp out/public-key.pem out/builder.rsa.pub; fi
          ls -lh out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-openwrt${{ matrix.version }}
          path: out/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ env.PKG_NAME }} - OpenWrt ${{ matrix.version }} 编译产物
          body_path: RELEASE_NOTES.md
          files: out/*
